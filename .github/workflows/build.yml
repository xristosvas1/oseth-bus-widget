name: Build Android Bus Widget APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Accept Android Licenses
      run: |
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Create Android Project Files
      run: |
        mkdir -p app/src/main/java/com/example/osethwidget
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/xml

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "OsethBusWidget"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.1'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.20'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.example.osethwidget'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.osethwidget"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:icon="@android:drawable/ic_dialog_info"
                android:label="ΟΣΕΘ Bus 14"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.DeviceDefault">
                <receiver
                    android:name=".BusWidget"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                        <action android:name="com.example.osethwidget.ACTION_REFRESH" />
                    </intent-filter>
                    <meta-data
                        android:name="android.appwidget.provider"
                        android:resource="@xml/bus_widget_info" />
                </receiver>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/bus_widget_info.xml
        <?xml version="1.0" encoding="utf-8"?>
        <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
            android:minWidth="200dp"
            android:minHeight="100dp"
            android:updatePeriodMillis="1800000"
            android:initialLayout="@layout/widget_layout"
            android:resizeMode="horizontal|vertical"
            android:widgetCategory="home_screen">
        </appwidget-provider>
        EOF

        cat << 'EOF' > app/src/main/res/layout/widget_layout.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:id="@+id/widget_container"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="14dp"
            android:background="#1E1E1E">

            <TextView
                android:id="@+id/txt_title"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="🚌 Γραμμή 14 (Στάση 1214)"
                android:textColor="#FFFFFF"
                android:textStyle="bold"
                android:textSize="15sp" />

            <TextView
                android:id="@+id/txt_content"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="8dp"
                android:text="Πατήστε για ανανέωση..."
                android:textColor="#E0E0E0"
                android:textSize="14sp" />
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/example/osethwidget/BusWidget.kt
        package com.example.osethwidget

        import android.app.PendingIntent
        import android.appwidget.AppWidgetManager
        import android.appwidget.AppWidgetProvider
        import android.content.ComponentName
        import android.content.Context
        import android.content.Intent
        import android.widget.RemoteViews
        import org.json.JSONObject
        import java.net.HttpURLConnection
        import java.net.URL
        import java.net.URLEncoder
        import java.text.SimpleDateFormat
        import java.util.Date
        import java.util.Locale
        import java.util.concurrent.Executors

        class BusWidget : AppWidgetProvider() {

            override fun onUpdate(context: Context, appWidgetManager: AppWidgetManager, appWidgetIds: IntArray) {
                for (appWidgetId in appWidgetIds) {
                    updateAppWidget(context, appWidgetManager, appWidgetId)
                }
            }

            override fun onReceive(context: Context, intent: Intent) {
                super.onReceive(context, intent)
                if (ACTION_REFRESH == intent.action) {
                    val appWidgetManager = AppWidgetManager.getInstance(context)
                    val componentName = ComponentName(context, BusWidget::class.java)
                    val appWidgetIds = appWidgetManager.getAppWidgetIds(componentName)
                    for (id in appWidgetIds) {
                        updateAppWidget(context, appWidgetManager, id)
                    }
                }
            }

            companion object {
                const val ACTION_REFRESH = "com.example.osethwidget.ACTION_REFRESH"
                private val executor = Executors.newSingleThreadExecutor()

                fun updateAppWidget(context: Context, appWidgetManager: AppWidgetManager, appWidgetId: Int) {
                    val views = RemoteViews(context.packageName, R.layout.widget_layout)

                    val intent = Intent(context, BusWidget::class.java).apply {
                        action = ACTION_REFRESH
                    }
                    val pendingIntent = PendingIntent.getBroadcast(
                        context, 0, intent,
                        PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                    )
                    views.setOnClickPendingIntent(R.id.widget_container, pendingIntent)
                    views.setTextViewText(R.id.txt_content, "Ανανέωση δεδομένων...")

                    appWidgetManager.updateAppWidget(appWidgetId, views)

                    executor.execute {
                        val resultText = fetchBusData()
                        views.setTextViewText(R.id.txt_title, "🚌 Γραμμή 14 — Στάση 1214")
                        views.setTextViewText(R.id.txt_content, resultText)
                        appWidgetManager.updateAppWidget(appWidgetId, views)
                    }
                }

                private fun fetchBusData(): String {
                    return try {
                        val dateFormat = SimpleDateFormat("dd/MM/yyyy HH:mm:ss", Locale.US)
                        val dateStr = URLEncoder.encode(dateFormat.format(Date()), "UTF-8")
                        val urlStr = "https://oseth.com.gr/el/telematics-api/stop/1214/timetable?language=el&date=$dateStr"

                        val url = URL(urlStr)
                        val conn = url.openConnection() as HttpURLConnection
                        conn.requestMethod = "GET"
                        conn.connectTimeout = 8000
                        conn.readTimeout = 8000

                        val jsonString = conn.inputStream.bufferedReader().use { it.readText() }
                        val json = JSONObject(jsonString)
                        val trips = json.getJSONObject("data").getJSONArray("trips")

                        val line14Trips = mutableListOf<Pair<Int, Boolean>>()

                        for (i in 0 until trips.length()) {
                            val trip = trips.getJSONObject(i)
                            val route = trip.optJSONObject("route")
                            val shortName = route?.optString("shortName", "") ?: ""

                            if (shortName == "14") {
                                val minutes = trip.optInt("arrivalInMinutes", -1)
                                val monitored = trip.optBoolean("monitored", false)
                                if (minutes >= 0) {
                                    line14Trips.add(Pair(minutes, monitored))
                                }
                            }
                        }

                        if (line14Trips.isEmpty()) {
                            "Δεν βρέθηκαν αφίξεις για τη Γραμμή 14."
                        } else {
                            val sb = StringBuilder()
                            val count = minOf(3, line14Trips.size)
                            for (i in 0 until count) {
                                val (min, live) = line14Trips[i]
                                val badge = if (live) "🟢 Live" else "🕒 Προγρ."
                                sb.append("• ").append(i + 1).append("η: ").append(min).append(" min (").append(badge).append(")")
                                if (i < count - 1) sb.append("\n")
                            }
                            sb.toString()
                        }
                    } catch (e: Exception) {
                        "Σφάλμα: ${e.localizedMessage}"
                    }
                }
            }
        }
        EOF

    - name: Setup Gradle Wrapper and Build
      run: |
        gradle wrapper --gradle-version 8.0
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OsethBusWidget-APK
        path: app/build/outputs/apk/debug/app-debug.apk
